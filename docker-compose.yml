services:
  frontend:
    build: .
    ports:
      - "4200:80"
    restart: unless-stopped

  frontend-dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "4200:4200"
    command: sh -c "npm ci && npx ng serve --host 0.0.0.0 --port 4200 --poll 2000"
    profiles:
      - dev

